<!doctype html>
<html lang="en">

<meta charset="utf-8">

<title>Document Cards</title>
<style>
:root{--yellow:#FFD100;--ink:#1f1f1f;--muted:#6b6b6b;--line:#e6e6e6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
body{overflow:hidden;display:flex;flex-direction:column}
.tools{flex:0 0 auto;display:none;flex-wrap:wrap;align-items:center;gap:10px;padding:2px 2px 14px}
.tools.on{display:flex}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#333}
.tabs button:hover{border-color:#bbb}
.tabs button.on{background:#141414;border-color:#141414;color:#fff}
.tabs button .n{font-weight:400;opacity:.7;margin-left:4px}
.find{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid #cfcfcf;border-radius:6px;padding:0 10px;min-width:220px;background:#fff}
.find:focus-within{border-color:#141414;box-shadow:0 0 0 2px var(--yellow)}
.find input{all:unset;flex:1;font-size:14px;padding:8px 0;color:#1f1f1f}
.find svg{width:16px;height:16px;color:#666}
.scroll{flex:1 1 auto;overflow:auto;padding:2px 4px 8px 2px}
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px}
.empty{display:none;padding:30px 4px;color:var(--muted);font-size:14px}
.empty.box{border:1px dashed #cfcfcf;border-radius:6px;text-align:center;padding:40px 16px;background:#fafafa}
button.card{all:unset;box-sizing:border-box;display:flex;flex-direction:column;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:box-shadow .15s,transform .15s}
button.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.14);transform:translateY(-2px)}
button.card:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.img{position:relative;aspect-ratio:16/10;background:#eee center/cover no-repeat}
.img.doc{background-color:#fff;background-size:contain;border-bottom:1px solid var(--line)}
.img .tag{position:absolute;z-index:1;left:8px;bottom:8px;background:#c62828;color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 5px;border-radius:3px}
.body{position:relative;padding:12px 40px 14px 14px;font-size:14px;font-weight:600;line-height:1.35}
.body svg{position:absolute;right:12px;top:50%;margin-top:-8px;width:16px;height:16px;color:#333}
.body small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
@media (max-width:900px){.grid{grid-template-columns:repeat(min(var(--cols,3),3),minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.find{margin-left:0;width:100%}}

/* Viewer overlay */
.ov{position:fixed;inset:0;background:#1b1b1b;display:none;flex-direction:column;z-index:10}
.ov.open{display:flex}
.bar{flex:0 0 auto;height:48px;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;background:#141414;color:#fff;border-bottom:3px solid var(--yellow)}
.bar .ttl{flex:1 1 auto;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a,.bar button{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:6px;font-size:13px;font-weight:600;color:#fff;cursor:pointer}
.bar a:hover,.bar button:hover{background:rgba(255,255,255,.12)}
.bar .x{background:var(--yellow);color:#141414;padding:0 14px}
.bar .x:hover{background:#ffdd33}
.bar svg{width:16px;height:16px}
.ov iframe{flex:1 1 auto;width:100%;border:0;background:#2a2a2a}
@media (max-width:600px){.bar .lbl{display:none}}
</style>
</head>

/* ---- build ---- */
var key = (location.hash || "#product-guide").slice(1).split("&")[0];
var set = SETS[key] || {items: []};
var cards = set.items.map(function(c){
  if (Array.isArray(c)) {
    var parts = c[1].split(" – "), grp = (set.groups && parts.length > 1) ? parts.pop() : "";
    return {t: parts.join(" – "), sub: grp, grp: grp, id: gid(c[0]), list: set.list};
  }
  c.id = gid(c.id); c.list = set.list; return c;
});
if (set.groups && !set.keepOrder) cards.sort(function(a, b){ return a.t.localeCompare(b.t, undefined, {numeric: true, sensitivity: "base"}); });
document.documentElement.style.setProperty("--cols", set.cols || 3);

var grid = document.getElementById("grid"), empty = document.getElementById("empty");
var arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';

// Lazy-load the first-page previews so 100+ cards don't all load at once.
var io = "IntersectionObserver" in window ? new IntersectionObserver(function(es){
  es.forEach(function(e){ if (e.isIntersecting) { var el = e.target; el.style.backgroundImage = "url('" + el.getAttribute("data-bg") + "')"; io.unobserve(el); } });
}, {root: document.getElementById("scroll"), rootMargin: "300px"}) : null;

cards.forEach(function(c){
  var b = document.createElement("button");
  b.className = "card"; b.type = "button";
  var im = document.createElement("div");
  var src = c.img || (c.list ? thumb(c.list, c.id) : "");
  im.className = "img" + (c.img || set.tag ? "" : " doc");
  if (!c.img) { var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = set.tag || "PDF"; im.appendChild(tg); }
  if (src) { src = src.replace(/'/g, "%27"); if (io) { im.setAttribute("data-bg", src); io.observe(im); } else im.style.backgroundImage = "url('" + src + "')"; }
  var bd = document.createElement("div"); bd.className = "body"; bd.textContent = c.t;
  if (c.sub) { var s = document.createElement("small"); s.textContent = c.sub; bd.appendChild(s); }
  bd.insertAdjacentHTML("beforeend", arrow);
  b.appendChild(im); b.appendChild(bd);
  b.addEventListener("click", function(){ openDoc(c); });
  c.el = b; c.key = (c.t + " " + (c.sub || "")).toLowerCase().replace(/[\s\-_.()\[\],+]/g, "");
  grid.appendChild(b);
});

if (!cards.length) { empty.textContent = set.empty || "No documents yet."; empty.classList.add("box"); empty.style.display = "block"; }
/* ---- tabs + search (only for big sets) ---- */
var curGroup = "", q = document.getElementById("q");
if (set.groups || set.search) {
  document.getElementById("tools").classList.add("on");
  var tabs = document.getElementById("tabs");
  var names = [""].concat(set.groups || []);
  names.forEach(function(g, i){
    var n = cards.filter(function(c){ return !g || c.grp === g; }).length;
    var t = document.createElement("button");
    t.type = "button"; t.setAttribute("role", "tab");
    t.innerHTML = (g ? (set.noPlural ? g : g + "s") : "All").replace("Detailss", "Details") + '<span class="n">' + n + "</span>";
    if (i === 0) t.classList.add("on");
    t.addEventListener("click", function(){
      tabs.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
      t.classList.add("on"); curGroup = g; filter();
    });
    tabs.appendChild(t);
  });
  if (set.ph) q.placeholder = set.ph;
  if (!set.groups) tabs.style.display = "none";
  q.addEventListener("input", filter);
}
function filter(){
  var s = q.value.toLowerCase().replace(/[\s\-_.()\[\],+]/g, ""), shown = 0;
  cards.forEach(function(c){
    var ok = (!curGroup || c.grp === curGroup) && (!s || c.key.indexOf(s) >= 0);
    c.el.style.display = ok ? "" : "none"; if (ok) shown++;
  });
  empty.style.display = shown ? "none" : "block";
  document.getElementById("scroll").scrollTop = 0;
}

/* ---- viewer ---- */
var ov = document.getElementById("ov"), fr = document.getElementById("fr"), lastCard = null;

function openDoc(c){
  lastCard = document.activeElement;
  document.getElementById("ovt").textContent = c.t + (c.sub ? " – " + c.sub : "");
  document.getElementById("dl").href = SITE + "/_layouts/15/download.aspx?UniqueId=" + c.id;
  fr.src = SITE + "/_layouts/15/embed.aspx?UniqueId=" + c.id;
  ov.classList.add("open");
  var el = document.documentElement;
  var rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (rq) { try { var p = rq.call(el); if (p && p.catch) p.catch(function(){}); } catch (e) {} }
  document.getElementById("x").focus();
}

function closeDoc(){
  ov.classList.remove("open");
  fr.src = "about:blank";
  var fe = document.fullscreenElement || document.webkitFullscreenElement;
  if (fe) { var ex = document.exitFullscreen || document.webkitExitFullscreen; try { var p = ex.call(document); if (p && p.catch) p.catch(function(){}); } catch (e) {} }
  if (lastCard) lastCard.focus();
}

document.getElementById("x").addEventListener("click", closeDoc);
document.addEventListener("keydown", function(e){ if (e.key === "Escape" && ov.classList.contains("open")) closeDoc(); });
// Leaving full screen (e.g. with Esc) also closes the document and returns to the cards.
["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
  document.addEventListener(ev, function(){
    if (!(document.fullscreenElement || document.webkitFullscreenElement) && ov.classList.contains("open")) closeDoc();
  });
});
