<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Discontinued Items</title>
<style>
:root{--yellow:#FFD100;--ink:#1a1a1a}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:#fff;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
.box{background:#141414;border-radius:10px;padding:22px 26px 24px;border-bottom:5px solid var(--yellow)}
h2{margin:0 0 4px;font-size:20px;font-weight:600;color:#fff}
p{margin:0 0 16px;font-size:13px;color:rgba(255,255,255,.75)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.brand{display:inline-flex;background:#2a2a2a;border-radius:8px;padding:4px;gap:4px}
.brand button{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:#ddd;padding:9px 16px;border-radius:6px}
.brand button.on{background:var(--yellow);color:var(--ink)}
.brand button:focus-visible{outline:2px solid #fff}
form{flex:1 1 360px;display:flex;align-items:center;background:#fff;border-radius:8px;padding:5px 5px 5px 14px;min-width:0}
form:focus-within{box-shadow:0 0 0 3px var(--yellow)}
form svg{flex:0 0 auto;color:#333}
input{flex:1 1 auto;min-width:0;border:0;outline:0;font:inherit;font-size:15px;padding:10px 12px;color:#1f1f1f;background:transparent}
input::placeholder{color:#6b6b6b}
.go{flex:0 0 auto;border:0;border-radius:6px;background:var(--yellow);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:10px 26px;cursor:pointer}
.go:hover{background:#ffdd33}
@media (max-width:600px){.box{padding:18px}.go{padding:10px 16px}}
</style>
</head>
<body>
<div class="box">
  <h2>Search discontinued items</h2>
  <p>Type a code or name (e.g. 675 or steel grey), choose the brand and press Search.</p>
  <div class="row">
    <div class="brand" role="radiogroup" aria-label="Brand">
      <button type="button" class="on" data-l="Discontinued%20Items%20%20Nolte" role="radio" aria-checked="true">Nolte Küchen</button>
      <button type="button" data-l="Discontinued%20Items%20%20Express" role="radio" aria-checked="false">Express Küchen</button>
    </div>
    <form id="f" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
      <input id="q" type="search" autocomplete="off" aria-label="Search discontinued items" placeholder="Search by code or name...">
      <button class="go" type="submit">Search</button>
    </form>
  </div>
</div>
<script>
var SITE = "https://noltefze.sharepoint.com/sites/NolteFZEKnowledgeHub/Lists/";
var list = "Discontinued%20Items%20%20Nolte";
document.querySelectorAll(".brand button").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".brand button").forEach(function(x){ x.classList.remove("on"); x.setAttribute("aria-checked","false"); });
    b.classList.add("on"); b.setAttribute("aria-checked","true"); list = b.getAttribute("data-l");
    document.getElementById("q").focus();
  });
});
function nav(url){
  var left = false;
  window.addEventListener("pagehide", function(){ left = true; }, {once:true});
  try { window.top.location.href = url; } catch (e) {}
  setTimeout(function(){ if (!left && document.visibilityState === "visible") window.open(url, "_blank", "noopener"); }, 900);
}
document.getElementById("f").addEventListener("submit", function(e){
  e.preventDefault();
  var q = document.getElementById("q").value.trim();
  var url = SITE + list + "/Gallery.aspx" + (q ? "?view=7&q=" + encodeURIComponent(q) : "");
  nav(url);
});
</script>
</body>
</html>
