<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nolte FZE Hub Search</title>
<style>
  :root{--yellow:#FFD100;--ink:#1a1a1a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#141414;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden}
  .hero{position:relative;height:100%;min-height:360px;background:#141414 url("bg.jpg") right center/cover no-repeat}
  .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.88) 0%,rgba(10,10,10,.65) 35%,rgba(10,10,10,.15) 62%,rgba(10,10,10,0) 80%)}
  .inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 56px}
  .eyebrow{color:var(--yellow);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px}
  h1{margin:0;font-size:40px;line-height:1.12;font-weight:700;max-width:680px}
  .sub{margin:12px 0 22px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.92);max-width:540px}
  form{display:flex;align-items:center;background:#fff;border-radius:8px;max-width:620px;padding:5px 5px 5px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  form svg{flex:0 0 auto;color:#333}
  input{flex:1 1 auto;min-width:0;border:0;outline:0;font:inherit;font-size:15px;padding:10px 12px;color:#1f1f1f;background:transparent}
  input::placeholder{color:#6b6b6b}
  button{flex:0 0 auto;border:0;border-radius:6px;background:var(--yellow);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:10px 26px;cursor:pointer}
  button:hover{background:#ffdd33}
  button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  form:focus-within{box-shadow:0 0 0 3px var(--yellow),0 8px 24px rgba(0,0,0,.35)}
  .pop{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:16px}
  .pop span{font-size:13px;font-weight:600;margin-right:4px}
  .pop a{font-size:13px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 15px;background:rgba(0,0,0,.25)}
  .pop a:hover{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
  /* Narrower embeds (e.g. a two-thirds column): slide the photo so the "Kitchens for life" panel does not sit under the text */
  @media (max-width:1150px){.hero{background-position:62% center}.inner{padding:24px 40px}h1{font-size:34px}.sub{font-size:15px;max-width:460px}}
  @media (max-width:760px){.inner{padding:20px}h1{font-size:28px}.hero::before{background:rgba(10,10,10,.7)}button{padding:10px 14px}}
</style>
</head>
<body>
<section class="hero">
  <div class="inner">
    <p class="eyebrow">Welcome to</p>
    <h1>Nolte FZE<br>Technical Knowledge Hub</h1>
    <p class="sub">Your central source for product information, technical resources, training and partner support.</p>
    <form id="f" role="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
      <input id="q" type="search" name="q" autocomplete="off" aria-label="Search the hub" placeholder="Search for products, drawings, installation guides, or anything...">
      <button type="submit">Search</button>
    </form>
    <div class="pop">
      <span>Popular searches:</span>
      <a href="#" data-q="Front codes">Front Codes</a>
      <a href="#" data-q="Installation guide">Installation Guide</a>
      <a href="#" data-q="Spare parts">Spare Parts</a>
      <a href="#" data-q="Discontinued">Discontinued Items</a>
    </div>
  </div>
</section>
<script>
  var SITE = "https://noltefze.sharepoint.com/sites/NolteFZEKnowledgeHub";
  function go(q){
    q = (q || "").trim();
    if (!q) { document.getElementById("q").focus(); return; }
    var url = SITE + "/_layouts/15/search.aspx/siteall?q=" + encodeURIComponent(q);
    var left = false;
    window.addEventListener("pagehide", function(){ left = true; }, {once:true});
    try { window.top.location.href = url; } catch (e) {}
    // If the embedding page blocks top navigation, open the results in a new tab instead.
    setTimeout(function(){ if (!left && document.visibilityState === "visible") window.open(url, "_blank", "noopener"); }, 900);
  }
  document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); go(document.getElementById("q").value); });
  document.querySelectorAll(".pop a").forEach(function(a){ a.addEventListener("click", function(e){ e.preventDefault(); go(a.getAttribute("data-q")); }); });
</script>
</body>
</html>
