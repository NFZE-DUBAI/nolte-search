<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Actions</title>
<style>
  :root{--yellow:#FFD100;--ink:#1f1f1f;--line:#ececec;--link:#0f6cbd}
  *{box-sizing:border-box}
  html,body{margin:0;overflow:hidden;background:#fff;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
  .head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 16px}
  h2{font-size:24px;font-weight:600;margin:0}
  .all{font-size:14px;color:var(--link);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .all:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:2px}
  a.tile{display:flex;align-items:center;gap:14px;min-height:92px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);color:inherit;text-decoration:none;transition:box-shadow .15s,border-color .15s}
  a.tile:hover{box-shadow:0 6px 16px rgba(0,0,0,.10);border-color:#dcdcdc}
  a.tile:focus-visible,.all:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  svg.ico{flex:0 0 auto;width:28px;height:28px;color:#222}
  .t{font-size:14px;line-height:1.35}
</style>
</head>
