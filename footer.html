<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nolte FZE Hub Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<style>
  :root{--bg:#202328;--yellow:#FFD100;--line:rgba(255,255,255,.28)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff}
  footer{height:100%;display:flex;align-items:center;gap:28px;padding:0 56px;border-top:3px solid #3a3d42}
  .brand{display:flex;align-items:center;gap:22px;flex:0 0 auto}
  .brand img{height:44px;width:auto;display:block}
  .sep{width:1px;align-self:stretch;margin:22px 0;background:var(--line)}
  .name{font-size:13px;line-height:1.5}
  .claim{font-size:13px}
  .script{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:"Allura","Segoe Script","Brush Script MT",cursive;font-size:30px;white-space:nowrap}
  .script::after{content:"";width:34px;height:2px;background:var(--yellow);margin-top:10px}
  .meta{flex:0 0 auto;text-align:right;font-size:12px;line-height:1.9;margin-left:48px}
  .meta a{color:#fff;text-decoration:none}
  .meta a:hover{color:var(--yellow)}
  .meta .bar{color:rgba(255,255,255,.5);margin:0 10px}
  .meta .upd{color:rgba(255,255,255,.75)}
  a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  @media (max-width:1150px){footer{padding:0 32px;gap:20px}.script{font-size:24px}.meta{margin-left:24px}}
  @media (max-width:860px){.script,.claim,.sep.s2{display:none}.meta{margin-left:auto}}
  @media (max-width:560px){.name{display:none}.sep{display:none}footer{padding:0 16px}}
</style>
</head>
