<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nolte FZE Hub Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFD100;--ink:#1a1a1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#141414;font-family:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff;overflow:hidden}
.hero{position:relative;height:100%;min-height:360px;background:#141414 url("bg.jpg") right center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,10,.9) 0%,rgba(10,10,10,.7) 35%,rgba(10,10,10,.25) 62%,rgba(10,10,10,.1) 100%)}
.inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 56px 30px;padding-right:calc(56px + var(--panel-w,260px) + 32px)}
.eyebrow{color:var(--yellow);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;margin:0 0 8px}
h1{margin:0;font-size:40px;line-height:1.12;font-weight:700;max-width:680px}
.sub{margin:12px 0 30px;font-size:16px;line-height:1.5;color:rgba(255,255,255,.92);max-width:540px}
.sbox{position:relative;max-width:640px}
form{display:flex;align-items:center;background:#fff;border-radius:8px;padding:5px 5px 5px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
form svg{flex:0 0 auto;color:#333}
input{flex:1 1 auto;min-width:0;border:0;outline:0;font:inherit;font-size:15px;padding:10px 12px;color:#1f1f1f;background:transparent}
input::placeholder{color:#6b6b6b}
input::-webkit-search-cancel-button{cursor:pointer}
button{flex:0 0 auto;border:0;border-radius:6px;background:var(--yellow);color:var(--ink);font:inherit;font-weight:600;font-size:15px;padding:10px 26px;cursor:pointer}
button:hover{background:#ffdd33}
button:focus-visible,a:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
form:focus-within{box-shadow:0 0 0 3px var(--yellow),0 8px 24px rgba(0,0,0,.35)}
/* Suggestions open upward so they are never clipped by the bottom of the embed */
.sug{position:absolute;left:0;right:0;bottom:calc(100% + 8px);background:#fff;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.45);list-style:none;margin:0;padding:6px;display:none;z-index:5}
.sug.open{display:block}
.sug li{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;cursor:pointer;color:#1f1f1f;font-size:14px}
.sug li .ttl{font-weight:600}
.sug li .hint{margin-left:auto;font-size:12px;color:#6b6b6b;white-space:nowrap}
.sug li.act,.sug li:hover{background:#fff6cc}
.sug li.all{border-top:1px solid #eee;margin-top:4px;color:#555}
.sug li .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:0 0 auto}
.pop{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-top:16px}
.pop span{font-size:13px;font-weight:600;margin-right:4px}
.pop a{font-size:13px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:5px 15px;background:rgba(0,0,0,.25)}
.pop a:hover{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
/* "Kitchens for life" panel */
.panel{position:absolute;top:28px;bottom:28px;right:40px;width:var(--panel-w,260px);background:rgba(28,28,28,.82);border-radius:10px;padding:0 28px;display:flex;flex-direction:column;justify-content:center;backdrop-filter:blur(2px)}
.panel .script{font-family:"Allura","Segoe Script","Brush Script MT",cursive;font-size:64px;line-height:.95;color:#fff;margin:0 0 26px;transform:rotate(-6deg);transform-origin:left center}
.panel .script span{display:block;padding-left:22px}
.panel .rule{width:44px;height:3px;background:var(--yellow);margin:0 0 16px}
.panel .tag{font-size:14px;line-height:1.5;color:#fff;margin:0}
/* Narrower embeds (two-thirds column) */
@media (max-width:1150px){:root{--panel-w:200px}.inner{padding-left:40px;padding-right:calc(40px + 200px + 24px)}h1{font-size:32px}.sub{font-size:15px}.panel{right:24px;padding:0 20px}.panel .script{font-size:50px}.panel .script span{padding-left:16px}}
@media (max-width:760px){.panel{display:none}.inner{padding:20px}h1{font-size:28px}.hero::before{background:rgba(10,10,10,.7)}button{padding:10px 14px}}
</style>
</head>
<body>
<section class="hero">
<div class="inner">
<p class="eyebrow">Welcome to</p>
<h1>Nolte FZE<br>Technical Knowledge Hub</h1>
<p class="sub">Your central source for product information, technical resources, training and partner support.</p>
<div class="sbox">
<ul class="sug" id="sug" role="listbox" aria-label="Suggestions"></ul>
<form id="f" role="search">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
<input id="q" type="search" name="q" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sug" aria-expanded="false" aria-label="Search the hub" placeholder="Search for products, drawings, installation guides, or anything...">
<button type="submit">Search</button>
</form>
</div>
<div class="pop">
<span>Popular searches:</span>
<a href="https://noltefze.sharepoint.com/sites/NolteFZEKnowledgeHub/SitePages/Front-Codes.aspx" target="_top">Front Codes</a>
<a href="https://noltefze.sharepoint.com/sites/NolteFZEKnowledgeHub/SitePages/Discontinued-Items.aspx" target="_top">Discontinued Items</a>
</div>
</div>
<aside class="panel" aria-label="Kitchens for life">
<p class="script">Kitchens<span>for life</span></p>
<div class="rule"></div>
<p class="tag">German Quality.<br>A Better Living.</p>
</aside>
</section>
<script>
var SITE = "https://noltefze.sharepoint.com/sites/NolteFZEKnowledgeHub";
var P = SITE + "/SitePages/";

/* ---------------------------------------------------------------
   SEARCH DIRECTORY
   Each entry: title shown, page file, keywords people may type.
   To add a page: copy one line and change the 3 values.
   --------------------------------------------------------------- */
var PAGES = [
  {t:"Product Documentation", u:"Product-Documentation.aspx", k:["product documentation","documentation","documents","product documents","product library"]},
  {t:"Catalogues", u:"Catalogues.aspx", k:["catalogues","catalogue","catalogs","catalog","brochure","brochures"]},
  {t:"Certificates", u:"Certificates.aspx", k:["certificates","certificate","certification","certifications","iso","quality certificate","dgm","tuv"]},
  {t:"Product Guide", u:"Product-Guide.aspx", k:["product guide","product guides","guide","guides","price list","pricelist","preisliste","nk guide","ek guide","nolte kuchen","nolte küchen","express kuchen","express küchen","pg"]},
  {t:"Front Codes", u:"Front-Codes.aspx", k:["front codes","front code","fronts","front","colour","colours","color","colors","front colour","door","doors"]},
  {t:"Spare Parts", u:"Spare-Parts.aspx", k:["spare parts","spare part","spare","spares","parts","replacement","replacement parts"]},
  {t:"Discontinued Items", u:"Discontinued-Items.aspx", k:["discontinued","discontinued items","discontinue","phase out","phased out","not available","stopped"]},
  {t:"Installation Center", u:"Installation-Center.aspx", k:["installation","installation center","install","installer","installers","fitting","fitter"]},
  {t:"Installation Videos", u:"Installation-Videos.aspx", k:["video","videos","installation video","installation videos","how to"]},
  {t:"Installation Manuals", u:"Installation-Manuals.aspx", k:["manual","manuals","installation manual","installation manuals","instructions","mounting","mounting instructions","assembly"]},
  {t:"Technical Drawings", u:"Technical-Drawings.aspx", k:["technical drawings","technical drawing","drawing","drawings","cad","dwg","dimensions","cabinet","cabinets","construction"]},
  {t:"POS & Marketing Materials", u:"POS-&-Marketing-Materials.aspx", k:["pos","marketing","marketing materials","flyer","flyers","logo","logos","presentation","presentations","pos materials"]},
  {t:"News & Product Updates", u:"News-&-Product-Updates.aspx", k:["news","updates","product updates","factory updates","factory update","launch","launches","announcement"]},
  {t:"Training Center", u:"Training-Center.aspx", k:["training","training center","academy","nolte academy","course","courses","training sessions"]},
  {t:"Materials & Finishes", u:"Materials-&-Finishes.aspx", k:["materials","material","finishes","finish","worktop","worktops","decor","decors","handles","handle","carcase","carcass"]},
  {t:"Technical Support Center", u:"Technical-Support-Center.aspx", k:["technical support","support","help","contact","contact us","technical team"]},
  {t:"Design and Showroom Updates", u:"Planning-&-Design-Guidelines.aspx", k:["design and showroom updates","showroom","showrooms","design updates","showroom updates","display","displays","planning","planning guidelines","design guidelines","design","kitchen planning"]},
  {t:"Technical Solutions & FAQ", u:"Technical-Solutions-&-FAQ.aspx", k:["faq","faqs","questions","question","technical solutions","solutions","answers","q&a"]},
  {t:"Design FAQ", u:"Design-FAQ.aspx", k:["design faq","design question","design questions"]},
  {t:"Technical FAQ", u:"Technical-FAQ.aspx", k:["technical faq","technical question","technical questions"]},
  {t:"Sales FAQ", u:"Sales-FAQ.aspx", k:["sales faq","sales","sales question","sales questions","pricing","quotation","quotations","quote","orders","order"]},
  {t:"Logistics FAQ", u:"Logistics-FAQ.aspx", k:["logistics faq","logistics","shipping","delivery","deliveries","tracking","loading week","loading","container","transport"]},
  {t:"SOP & Processes", u:"SOP-&-Processes.aspx", k:["sop","sops","process","processes","procedure","procedures","workflow"]},
  {t:"Partner Support", u:"Partner-Support.aspx", k:["partner","partners","partner support","dealer","dealers","distributor"]},
  {t:"About", u:"About.aspx", k:["about","about us","nolte fze","company"]},
  {t:"Installation Training in Germany", u:"Installation-Training-in-Germany.aspx", k:["installation training","germany training","training germany"]},
  {t:"ECO Products Discontinued", u:"ECO-Products-Discontinued-from-Week-27-2026.aspx", k:["eco","eco products","eco discontinued"]},
  {t:"Stripe Range Discontinued", u:"Stripe-Range-Discontinued.aspx", k:["stripe","stripe range"]}
];

function norm(s){
  return (s||"").toLowerCase()
    .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
    .replace(/&/g," and ").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}
function stem(w){ return w.length > 4 ? w.replace(/(es|s)$/,"") : w; }
function toks(s){ return norm(s).split(" ").filter(function(w){ return w && ["the","a","an","and","of","for","to","in","on","my","me","i","need","show","find"].indexOf(w) < 0; }).map(stem); }

PAGES.forEach(function(p){
  p.nt = norm(p.t);
  p.nk = p.k.map(norm);
  p.tk = {};
  [p.t].concat(p.k).forEach(function(s){ toks(s).forEach(function(w){ p.tk[w] = 1; }); });
});

function score(p, q){
  var nq = norm(q); if (!nq) return 0;
  var qt = toks(q); if (!qt.length) return 0;
  if (p.nt === nq) return 100;
  if (p.nk.indexOf(nq) >= 0) return 95;
  var s = 0;
  // A bare 3-4 digit number is treated as a front code (e.g. 491).
  if (p.u === "Front-Codes.aspx" && /^\d{3,4}$/.test(nq)) return 90;
  if (p.nt.indexOf(nq) === 0 && nq.length >= 2) s = Math.max(s, 85);
  p.nk.forEach(function(k){
    if (k.indexOf(nq) === 0 && nq.length >= 3) s = Math.max(s, 75);
    if (k.length >= 3 && (" " + nq + " ").indexOf(" " + k + " ") >= 0) s = Math.max(s, 60 + Math.min(k.length, 20));
  });
  var hit = 0;
  qt.forEach(function(w){
    if (p.tk[w]) hit++;
    else if (w.length >= 3) { for (var k in p.tk) { if (k.indexOf(w) === 0) { hit += 0.9; break; } } }
  });
  s = Math.max(s, Math.round(55 * hit / qt.length));
  return s;
}
function rank(q){
  return PAGES.map(function(p){ return {p:p, s:score(p, q)}; })
    .filter(function(r){ return r.s >= 30; })
    .sort(function(a, b){ return b.s - a.s; });
}

function nav(url){
  var left = false;
  window.addEventListener("pagehide", function(){ left = true; }, {once:true});
  try { window.top.location.href = url; } catch (e) {}
  // If the embedding page blocks top navigation, open in a new tab instead.
  setTimeout(function(){ if (!left && document.visibilityState === "visible") window.open(url, "_blank", "noopener"); }, 900);
}
function spSearch(q){ return SITE + "/_layouts/15/search.aspx/siteall?q=" + encodeURIComponent(q); }

var inp = document.getElementById("q"), box = document.getElementById("sug"), items = [], act = -1;

function render(){
  var q = inp.value.trim();
  box.innerHTML = ""; items = []; act = -1;
  if (!q) { close(); return; }
  rank(q).slice(0, 5).forEach(function(r){ items.push({label:r.p.t, url:P + r.p.u, hint:"Page"}); });
  items.push({label:'Search the whole site for "' + q + '"', url:spSearch(q), all:true});
  items.forEach(function(it, i){
    var li = document.createElement("li");
    li.setAttribute("role", "option");
    if (it.all) { li.className = "all"; li.textContent = it.label; }
    else {
      var d = document.createElement("span"); d.className = "dot";
      var t = document.createElement("span"); t.className = "ttl"; t.textContent = it.label;
      var h = document.createElement("span"); h.className = "hint"; h.textContent = it.hint;
      li.appendChild(d); li.appendChild(t); li.appendChild(h);
    }
    li.addEventListener("mousedown", function(e){ e.preventDefault(); nav(it.url); });
    box.appendChild(li);
  });
  box.classList.add("open"); inp.setAttribute("aria-expanded", "true");
}
function close(){ box.classList.remove("open"); inp.setAttribute("aria-expanded", "false"); act = -1; }
function highlight(i){
  var lis = box.querySelectorAll("li");
  lis.forEach(function(li){ li.classList.remove("act"); });
  if (i >= 0 && lis[i]) lis[i].classList.add("act");
  act = i;
}

function go(q){
  q = (q || "").trim();
  if (!q) { inp.focus(); return; }
  if (act >= 0 && items[act]) { nav(items[act].url); return; }
  var r = rank(q);
  // Go straight to the best matching page; only fall back to SharePoint search when nothing matches.
  if (r.length && r[0].s >= 40) nav(P + r[0].p.u);
  else nav(spSearch(q));
}

inp.addEventListener("input", render);
inp.addEventListener("focus", function(){ if (inp.value.trim()) render(); });
inp.addEventListener("blur", function(){ setTimeout(close, 150); });
inp.addEventListener("keydown", function(e){
  if (!box.classList.contains("open")) return;
  var n = items.length;
  if (e.key === "ArrowDown") { e.preventDefault(); highlight((act + 1) % n); }
  else if (e.key === "ArrowUp") { e.preventDefault(); highlight(act <= 0 ? n - 1 : act - 1); }
  else if (e.key === "Escape") { close(); }
});
document.getElementById("f").addEventListener("submit", function(e){ e.preventDefault(); go(inp.value); });
</script>
</body>
</html>
